services:

  # ── Telegram Bot ──────────────────────────────────────────────────────────────
  telegram-bot:
    image: deiraaisyar/nappa-bot:latest
    container_name: nappa-bot
    command: python3 -m bot.main
    env_file:
      - .env
    volumes:
      - app_data:/app/data
      - ./bot:/app/bot    
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Streamlit Dashboard ───────────────────────────────────────────────────────
  dashboard:
    image: deiraaisyar/nappa-dashboard:latest
    container_name: nappa-dashboard
    command: >
      streamlit run dashboard/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    env_file:
      - .env
    volumes:
      - app_data:/app/data    # same volume — reads live DB written by bot
    ports:
      - "8501:8501"
    restart: always
    depends_on:
      - telegram-bot
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:                   # named volume — persists across restarts, initialized from image
